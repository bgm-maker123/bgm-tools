<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BGM投稿記録</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1 id="channel-name">BGM投稿記録</h1>
      <div class="top-actions">
        <a id="edit-link" class="btn" href="#" target="_blank" rel="noopener">✏️ データを編集</a>
        <button id="theme-toggle" class="btn" type="button" aria-label="表示モード切り替え">🌓 自動</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="error" class="error" hidden></div>

    <section class="stats" aria-label="まとめ">
      <div class="stat"><span class="stat-label">投稿数</span><span id="stat-count" class="stat-value">–</span></div>
      <div class="stat"><span class="stat-label">合計再生数</span><span id="stat-views" class="stat-value">–</span></div>
      <div class="stat"><span class="stat-label">平均視聴維持率</span><span id="stat-ret" class="stat-value">–</span></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>テーマ別の伸び</h2>
        <div class="seg" role="group" aria-label="グラフの指標">
          <button type="button" data-metric="total" class="on">合計再生数</button>
          <button type="button" data-metric="avg">平均再生数</button>
          <button type="button" data-metric="ret">平均維持率</button>
        </div>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>投稿した動画</h2>
        <label class="sort">並べ替え
          <select id="sort">
            <option value="date">新しい順</option>
            <option value="views">再生数の多い順</option>
            <option value="retention">視聴維持率の高い順</option>
          </select>
        </label>
      </div>
      <div id="videos" class="videos"></div>
    </section>

    <section class="card">
      <h2>次に作るテーマ候補</h2>
      <ul id="themes" class="plain-list"></ul>
    </section>

    <section class="card">
      <h2>SUNO用プロンプトのメモ</h2>
      <div id="prompts" class="prompts"></div>
    </section>

    <p class="foot">データは <code>docs/data.json</code> を編集すると更新されます（反映まで1〜2分）。</p>
  </main>

  <div id="tip" class="tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
